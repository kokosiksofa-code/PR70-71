services:
  db:
    image: postgres:16-alpine
    container_name: loveli-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: loveli_db
      POSTGRES_USER: loveli_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - loveli_postgres_data:/var/lib/postgresql/data
      - ./Loveli_PostgreSQL.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loveli_user -d loveli_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: loveli-app
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: loveli_db
      DB_USER: loveli_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  loveli_postgres_data:

